apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-probe
  labels:
    app: ha-probe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ha-probe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ha-probe
    spec:
      containers:
        - name: ha-probe
          image: image-registry.openshift-image-registry.svc:5000/ha-probe/ha-probe:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: QUERY_INTERVAL_MS
              value: "750"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ha-probe-db
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
